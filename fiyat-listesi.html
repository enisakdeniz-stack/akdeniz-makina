<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Akdeniz Makina - Fiyat Listesi</title>

    <link rel="apple-touch-icon" href="https://i.ibb.co/Y7LRMkr3/1-A468574-4-AFF-42-EA-81-EA-7756-D9017-D56.png">
    <link rel="shortcut icon" href="https://i.ibb.co/Y7LRMkr3/1-A468574-4-AFF-42-EA-81-EA-7756-D9017-D56.png">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .safe-pt { padding-top: env(safe-area-inset-top); }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const { useState, useEffect, useMemo } = React;

        // NOT: Bu, ana uygulamayla (Akdeniz Takip Pro) AYNI Firebase projesidir — aynı price_list koleksiyonunu okur.
        const firebaseConfig = {
            apiKey: "AIzaSyDb--JGJG7gdHcAXXGtvwT9FmrRnxjvCvo",
            authDomain: "cnc-takip-460b6.firebaseapp.com",
            projectId: "cnc-takip-460b6",
            storageBucket: "cnc-takip-460b6.firebasestorage.app",
            messagingSenderId: "627287710354",
            appId: "1:627287710354:web:4b04d452c51ac793bda44b"
        };

        // !!! BURAYI GÜNCELLE: WhatsApp Business numaranız (başında ülke kodu, boşluksuz, + işaretsiz) !!!
        const WHATSAPP_NUMBER = "905XXXXXXXXX"; // örn: 905321234567

        let app, db, auth, dbError = null;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error(e);
            dbError = e.message;
        }

        const LOGO_LINKI = "https://i.ibb.co/Y7LRMkr3/1-A468574-4-AFF-42-EA-81-EA-7756-D9017-D56.png";
        const BRANDS = ['AR', 'Interpump', 'Comet', 'Hawk', 'Bertolini', 'STM'];
        const CURRENCIES = { TRY: { symbol: '₺' }, USD: { symbol: '$' }, EUR: { symbol: '€' } };

        const Icon = (p) => React.createElement("svg", {...p, xmlns:"http://www.w3.org/2000/svg", width:"18", height:"18", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"2", strokeLinecap:"round", strokeLinejoin:"round"});
        const IconSearch = () => React.createElement("svg", {xmlns:"http://www.w3.org/2000/svg", width:"20", height:"20", viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:"2", strokeLinecap:"round", strokeLinejoin:"round", className:"text-gray-400"}, React.createElement("circle", {cx:"11", cy:"11", r:"8"}), React.createElement("line", {x1:"21", x2:"16.65", y1:"21", y2:"16.65"}));
        const IconWhatsapp = () => React.createElement("svg", {xmlns:"http://www.w3.org/2000/svg", width:"16", height:"16", viewBox:"0 0 24 24", fill:"currentColor"}, React.createElement("path", {d:"M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.83 14.09c-.25.7-1.24 1.28-2.03 1.45-.55.12-1.26.21-3.67-.79-3.08-1.27-5.06-4.39-5.21-4.6-.15-.2-1.25-1.66-1.25-3.17s.79-2.25 1.07-2.56c.28-.31.61-.38.82-.38.2 0 .41 0 .59.01.19.01.44-.07.69.53.25.6.85 2.08.93 2.23.08.15.13.33.03.53-.1.2-.15.33-.3.5-.15.18-.31.4-.44.53-.15.15-.3.31-.13.61.17.3.76 1.26 1.64 2.04 1.13 1 2.08 1.32 2.38 1.47.3.15.48.13.65-.08.18-.2.75-.87.95-1.17.2-.3.4-.25.66-.15.28.1 1.75.83 2.05.98.3.15.5.23.57.35.08.13.08.75-.17 1.46z"}));

        function App() {
            if (dbError) return React.createElement("div", {className: "p-10 text-red-600 font-bold"}, "Hata: " + dbError);

            const [user, setUser] = useState(null);
            const [priceList, setPriceList] = useState([]);
            const [brandFilter, setBrandFilter] = useState('ALL');
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const unsubAuth = onAuthStateChanged(auth, (u) => {
                    if (u) setUser(u);
                    else signInAnonymously(auth).catch((error) => console.error("Giriş hatası:", error));
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!db || !user) return;
                const q = query(collection(db, "price_list"), orderBy("brand", "asc"));
                const unsub = onSnapshot(q, (s) => setPriceList(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => unsub();
            }, [user]);

            const formatMoney = (val, cur) => {
                const symbol = (CURRENCIES[cur] || CURRENCIES.TRY).symbol;
                return (val || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2 }) + ' ' + symbol;
            };

            const filteredList = useMemo(() => {
                let result = priceList;
                if (brandFilter !== 'ALL') result = result.filter(p => p.brand === brandFilter);
                if (searchTerm) {
                    const term = searchTerm.toUpperCase();
                    result = result.filter(p => (p.name || '').includes(term) || (p.code || '').includes(term));
                }
                return result;
            }, [priceList, brandFilter, searchTerm]);

            const whatsappLink = (item) => {
                const text = encodeURIComponent(`Merhaba, ${item.name}${item.code ? ' (' + item.code + ')' : ''} hakkında bilgi almak istiyorum.`);
                return `https://wa.me/${WHATSAPP_NUMBER}?text=${text}`;
            };

            return React.createElement("div", {className: "min-h-screen pb-10 font-sans safe-pt bg-slate-50"},
                React.createElement("div", {className: "bg-slate-900 text-white p-4 flex items-center gap-2 sticky top-0 z-10 safe-pt"},
                    React.createElement("img", {src: LOGO_LINKI, className: "w-8 h-8 rounded-full bg-white"}),
                    React.createElement("h1", {className: "font-bold"}, "Akdeniz Makina · Fiyat Listesi")
                ),

                React.createElement("main", {className: "max-w-md mx-auto p-4 space-y-4"},
                    React.createElement("div", {className: "bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2"},
                        React.createElement("div", {className: "flex gap-1 flex-wrap"},
                            React.createElement("button", {onClick: ()=>setBrandFilter('ALL'), className: `px-3 py-1.5 text-xs font-bold rounded-full border ${brandFilter==='ALL' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-200'}`}, "TÜMÜ"),
                            BRANDS.map(b => React.createElement("button", {key: b, onClick: ()=>setBrandFilter(b), className: `px-3 py-1.5 text-xs font-bold rounded-full border ${brandFilter===b ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-200'}`}, b))
                        ),
                        React.createElement("div", {className: "relative"},
                            React.createElement("input", {value: searchTerm, onChange: e=>setSearchTerm(e.target.value), placeholder: "Ürün adı veya kodu ara...", className: "w-full p-2.5 pl-8 border rounded-xl text-sm font-bold outline-none"}),
                            React.createElement("div", {className: "absolute left-2.5 top-3"}, React.createElement(IconSearch))
                        )
                    ),

                    React.createElement("div", {className: "space-y-2"},
                        !user ? React.createElement("div", {className: "text-center p-10 text-slate-400 text-sm animate-pulse"}, "Yükleniyor...") :
                        filteredList.length === 0 ? React.createElement("div", {className: "text-center p-10 text-slate-400 text-sm italic"}, "Ürün bulunamadı.") :
                        filteredList.map(item => React.createElement("div", {key: item.id, className: "bg-white p-3 rounded-xl border border-slate-200 shadow-sm"},
                            React.createElement("div", {className: "flex justify-between items-start gap-2"},
                                React.createElement("div", {className: "flex-1 min-w-0"},
                                    React.createElement("div", {className: "flex items-center gap-2"},
                                        React.createElement("span", {className: "text-[9px] font-bold bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded flex-none"}, item.brand),
                                        React.createElement("span", {className: "font-bold text-sm"}, item.name)
                                    ),
                                    item.code && React.createElement("div", {className: "text-[10px] text-gray-400 mt-0.5"}, item.code),
                                    item.category && React.createElement("div", {className: "text-[10px] text-gray-400"}, item.category),
                                    item.note && React.createElement("div", {className: "text-[10px] text-emerald-600 mt-0.5"}, item.note)
                                ),
                                React.createElement("div", {className: "font-black text-emerald-700 whitespace-nowrap"}, formatMoney(item.price, item.currency))
                            ),
                            React.createElement("a", {
                                href: whatsappLink(item), target: "_blank", rel: "noopener noreferrer",
                                className: "mt-2 w-full py-2 bg-green-600 text-white rounded-lg font-bold text-xs flex items-center justify-center gap-1.5"
                            }, React.createElement(IconWhatsapp), "WhatsApp'tan Sor")
                        ))
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
